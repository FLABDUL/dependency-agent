[project]
name = "dependency-agent"
version = "0.1.0"
description = "Explain Maven dependency failures with evidence and a minimal fix."
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.116.0,<1",
    "uvicorn[standard]>=0.35.0,<1",
]

[project.scripts]
depguy = "dependency_agent.cli:main"
dependency-agent = "dependency_agent.cli:main"

[project.optional-dependencies]
dev = [
    "httpx>=0.28.0,<1",
    "pytest>=8.4.0,<9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
